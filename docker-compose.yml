services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: reach it through an SSH tunnel, never expose it publicly.
    # Host port is configurable to avoid clashing with a local PostgreSQL.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-9901}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  daemon:
    build: .
    image: wa-group-ingest:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      AUTH_DIR: /app/data/auth
      MIGRATIONS_DIR: /app/src/db/migrations
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - wa_data:/app/data
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  pgdata:
  wa_data:
